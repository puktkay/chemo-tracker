function CycleCell({ cycle, cycleNum, onUpdate }) {
  const [editing, setEditing] = useState(false);
  const [dateVal, setDateVal] = useState(cycle.date || "");
  useEffect(() => setDateVal(cycle.date || ""), [cycle.date]);
  const status = cycle.date ? (new Date(cycle.date) <= new Date() ? "completed" : "scheduled") : "pending";
  const cfg = STATUS_CONFIG[status];
  function save() { onUpdate({ ...cycle, date:dateVal }); setEditing(false); }
  if (editing) return (
    <div style={{ display:"flex", flexDirection:"column", gap:4 }}>
      <input type="date" value={dateVal} onChange={e=>setDateVal(e.target.value)} autoFocus
        style={{ border:"1.5px solid #6366f1", borderRadius:6, padding:"4px 6px", fontSize:12, width:130, fontFamily:"inherit", background:"#fff" }} />
      <div style={{ display:"flex", gap:4 }}>
        <button onClick={save} style={{ flex:1, background:"#6366f1", color:"#fff", border:"none", borderRadius:5, padding:"3px 0", fontSize:11, cursor:"pointer" }}>確認</button>
        <button onClick={()=>setEditing(false)} style={{ flex:1, background:"#e2e8f0", color:"#475569", border:"none", borderRadius:5, padding:"3px 0", fontSize:11, cursor:"pointer" }}>關閉</button>
      </div>
      {cycle.date && <button onClick={()=>{ onUpdate({...cycle,date:""}); setDateVal(""); setEditing(false); }}
        style={{ background:"#fee2e2", color:"#ef4444", border:"1px solid #fca5a5", borderRadius:5, padding:"3px 0", fontSize:11, cursor:"pointer", width:"100%" }}>
        ✕ 取消施打紀錄
      </button>}
    </div>
  );
  return (
    <div onClick={()=>setEditing(true)} title="點擊設定日期"
      style={{ background:cfg.bg, color:cfg.color, border:`1.5px solid ${cfg.color}`, borderRadius:8, padding:"5px 8px", cursor:"pointer", minWidth:90, textAlign:"center", userSelect:"none" }}>
      <div style={{ fontSize:10, fontWeight:700 }}>第 {cycleNum} 次</div>

      {cycle.date && <div style={{ fontSize:10, marginTop:1, opacity:.8 }}>{new Date(cycle.date).toLocaleDateString("zh-TW",{month:"2-digit",day:"2-digit"})}</div>}
    </div>
  );
}

  return (

        <div style={{ width:`${pct}%`, height:"100%", borderRadius:99, background: pct===100?"#22c55e":"linear-gradient(90deg,#6366f1,#8b5cf6)", transition:"width .4s" }} />
      </div>
      <span style={{ fontSize:12, color:"#64748b", minWidth:40, textAlign:"right" }}>{done}/{total}</span>
    </div>
  );
}

// ── Excel ──────────────────────────────────────────────────────────
function exportExcel(patients) {
  const maxCycles = Math.max(...patients.map(p=>p.cycles.length), 1);
  const headers = ["姓名","病歷號","化療組合","總療程次數","備註",...Array.from({length:maxCycles},(_,i)=>`第${i+1}次`)];
  const rows = patients.map(p=>[
    p.name, p.mrn, p.regimen, p.totalCycles, p.notes||"",
    ...p.cycles.map(c=>c.date||""),
    ...Array(maxCycles-p.cycles.length).fill("")
  ]);
  const ws = XLSX.utils.aoa_to_sheet([headers,...rows]);
  ws["!cols"] = [{wch:10},{wch:12},{wch:16},{wch:10},{wch:30},...Array(maxCycles).fill({wch:12})];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "化療進度");
  XLSX.writeFile(wb, `化療進度_${new Date().toLocaleDateString("zh-TW").replace(/\//g,"-")}.xlsx`);
}

function importExcel(file, onImport) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(e.target.result, { type:"binary", cellDates:true });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header:1 });
      const header = rows[0];
      const patients = rows.slice(1).filter(r=>r[0]).map((r,i)=>{
        const totalCycles = parseInt(r[3])||6;
        const dates = r.slice(5,5+totalCycles).map(v=>{
          if (!v) return "";
          if (v instanceof Date) return v.toISOString().slice(0,10);
          const s = String(v).trim();
          if (s.match(/^\d{4}-\d{2}-\d{2}$/)) return s;
          return "";
        });
        const cycles = Array.from({length:totalCycles},(_,j)=>({date:dates[j]||""}));
        return { id:Date.now()+i, name:r[0]||"", mrn:String(r[1]||""), regimen:r[2]||"", totalCycles, notes:r[4]||"", cycles };
      });
      onImport(patients);
    } catch(err) { alert("匯入失敗：" + err.message); }
  };
  reader.readAsBinaryString(file);
}

function MainApp({ apiUrl }) {
  const [patients, setPatients] = useState(DEFAULT_PATIENTS);
  const [showAdd, setShowAdd] = useState(false);
  const [newP, setNewP] = useState({ name:"", mrn:"", regimen:"", totalCycles:"" });
  const [syncStatus, setSyncStatus] = useState("idle"); // idle | loading | saving | saved | error | local
  const [lastSync, setLastSync] = useState(null);
  const saveTimer = useRef(null);
  const importRef = useRef();

  // ── API helpers ──
  async function apiFetch(path, opts={}) {
    const url = `${apiUrl}${path}`;
    return fetch(url, { ...opts, headers:{ "Content-Type":"application/json", "X-API-Key":API_SECRET, ...(opts.headers||{}) } });
  }

  // ── Load on mount ──
  useEffect(() => {
    if (!apiUrl) {
      // 無伺服器：用 localStorage
      try {
        const saved = localStorage.getItem("chemo_tracker_v1");
        if (saved) setPatients(JSON.parse(saved));
      } catch(e){}
      setSyncStatus("local");
      return;
    }
    setSyncStatus("loading");
    apiFetch("/patients")
      .then(r=>r.json())
      .then(data=>{
        if (data.patients && data.patients.length > 0) {
          setPatients(data.patients);
          setLastSync(new Date());
          setSyncStatus("saved");
        } else {
          // 伺服器是空的，上傳預設資料
          saveToServer(DEFAULT_PATIENTS);
        }
      })
      .catch(()=>{ setSyncStatus("error"); });
  }, []);

  // ── Save to server (debounced) ──
  function saveToServer(data) {
    if (!apiUrl) {
      try { localStorage.setItem("chemo_tracker_v1", JSON.stringify(data)); setSyncStatus("saved"); } catch(e){}
      return;
    }
    setSyncStatus("saving");
    apiFetch("/patients", { method:"POST", body:JSON.stringify({patients:data}) })
      .then(r=>r.json())
      .then(()=>{ setSyncStatus("saved"); setLastSync(new Date()); })
      .catch(()=>setSyncStatus("error"));
  }

  function updatePatients(newList) {
    setPatients(newList);
    setSyncStatus("saving");
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(()=>saveToServer(newList), 800);
  }

  // ── Excel import ──
  function handleImport(e) {
    const file = e.target.files[0];
    if (!file) return;
    importExcel(file, imported => {
      if (window.confirm(`確認匯入 ${imported.length} 位病人？（將覆蓋現有資料）`)) {
        updatePatients(imported);
      }
    });
    e.target.value = "";
  }

  const totalCompleted = patients.reduce((s,p)=>s+p.cycles.filter(c=>c.date&&new Date(c.date)<=new Date()).length,0);
  const totalCycles = patients.reduce((s,p)=>s+p.cycles.length,0);

  const statusIcon = { idle:"", loading:"⟳ 載入中", saving:"⟳ 同步中", saved:"✓ 已同步", error:"⚠ 連線失敗", local:"💾 本機儲存" };
  const statusColor = { saving:"rgba(255,220,100,.9)", saved:"rgba(255,255,255,.7)", error:"#fca5a5", loading:"rgba(255,220,100,.9)", local:"rgba(255,255,255,.6)", idle:"transparent" };

  const snf = k => e => setNewP(p=>({...p,[k]:e.target.value}));

  function addPatient() {
    if (!newP.name && !newP.mrn) return;
    const count = parseInt(newP.totalCycles)||1;
    const list = [...patients, {...newP, id:Date.now(), totalCycles:count, cycles:Array.from({length:count},()=>({date:""})), notes:""}];
    updatePatients(list);
    setNewP({name:"",mrn:"",regimen:"",totalCycles:""});
    setShowAdd(false);
  }

  return (
    <div style={{ minHeight:"100vh", paddingBottom:40 }}>
      {/* Header */}
      <div style={{ background:"linear-gradient(135deg,#4f46e5 0%,#7c3aed 60%,#6d28d9 100%)", padding:"20px 20px 24px", boxShadow:"0 4px 24px rgba(79,70,229,.25)" }}>
        <div style={{ maxWidth:700, margin:"0 auto" }}>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:4 }}>
            <div style={{ display:"flex", alignItems:"center", gap:10 }}>
              <span style={{ fontSize:26 }}>💊</span>
              <div>
                <h1 style={{ margin:0, fontSize:20, color:"#fff", fontWeight:800 }}>化療進度追蹤系統</h1>
                <div style={{ color:"rgba(255,255,255,.6)", fontSize:11 }}>Chemotherapy Progress Tracker</div>
              </div>
            </div>
            <div style={{ display:"flex", flexDirection:"column", alignItems:"flex-end", gap:6 }}>
              <div style={{ fontSize:11, color:statusColor[syncStatus] }}>{statusIcon[syncStatus]}{lastSync&&syncStatus==="saved"?` ${lastSync.toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"})}`:""}</div>
              <button onClick={()=>{ sessionStorage.removeItem(AUTH_KEY); window.location.reload(); }}
                style={{ background:"rgba(255,255,255,.15)", border:"none", borderRadius:7, color:"#fff", padding:"4px 10px", fontSize:11, cursor:"pointer" }}>
                🔒 登出
              </button>
            </div>
          </div>
          <div style={{ display:"flex", gap:10, marginTop:14 }}>
            {[{label:"病人總數",value:patients.length,icon:"👤"},{label:"已完成療程",value:totalCompleted,icon:"✅"},{label:"總療程數",value:totalCycles,icon:"📋"}].map(s=>(
              <div key={s.label} style={{ flex:1, background:"rgba(255,255,255,.15)", borderRadius:12, padding:"10px 12px" }}>
                <div style={{ fontSize:16 }}>{s.icon}</div>
                <div style={{ color:"#fff", fontSize:20, fontWeight:800, lineHeight:1.1 }}>{s.value}</div>
                <div style={{ color:"rgba(255,255,255,.6)", fontSize:10, marginTop:1 }}>{s.label}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      <div style={{ maxWidth:700, margin:"0 auto", padding:"16px 16px 0" }}>
        {/* Action buttons */}
        <div style={{ display:"flex", gap:10, marginBottom:14 }}>
          <button onClick={()=>setShowAdd(true)} style={{ flex:2, background:"linear-gradient(135deg,#6366f1,#8b5cf6)", color:"#fff", border:"none", borderRadius:12, padding:"12px 0", fontSize:14, fontWeight:700, cursor:"pointer", boxShadow:"0 4px 14px rgba(99,102,241,.35)" }}>
            ＋ 新增病人
          </button>
          <button onClick={()=>exportExcel(patients)} style={{ flex:1, background:"#fff", color:"#16a34a", border:"2px solid #16a34a", borderRadius:12, padding:"12px 0", fontSize:13, fontWeight:700, cursor:"pointer" }}>
            📥 匯出 Excel
          </button>
          <button onClick={()=>importRef.current.click()} style={{ flex:1, background:"#fff", color:"#6366f1", border:"2px solid #6366f1", borderRadius:12, padding:"12px 0", fontSize:13, fontWeight:700, cursor:"pointer" }}>
            📤 匯入 Excel
          </button>
          <input ref={importRef} type="file" accept=".xlsx,.xls" onChange={handleImport} style={{ display:"none" }} />
        </div>

        {syncStatus==="error" && (
          <div style={{ background:"#fef2f2", border:"1.5px solid #fca5a5", borderRadius:10, padding:"10px 14px", marginBottom:14, fontSize:13, color:"#dc2626", display:"flex", alignItems:"center", gap:8 }}>
            ⚠️ 無法連線到伺服器，目前顯示本機快取資料。請確認桌機伺服器正在運行。
          </div>
        )}

        <div style={{ display:"flex", flexDirection:"column", gap:14 }}>
          {patients.map(p=>(
            <PatientCard key={p.id} patient={p}
              onUpdate={u=>updatePatients(patients.map(x=>x.id===p.id?{...u,id:p.id}:x))}
              onDelete={()=>updatePatients(patients.filter(x=>x.id!==p.id))} />
          ))}
        </div>
        {patients.length===0 && <div style={{ textAlign:"center", padding:"48px 20px", color:"#94a3b8" }}>
          <div style={{ fontSize:48, marginBottom:12 }}>🏥</div>
          <div style={{ fontSize:15, fontWeight:600 }}>尚無病人資料</div>
        </div>}
      </div>

      {showAdd && <Modal title="新增病人" onSave={addPatient} onCancel={()=>setShowAdd(false)}>
        <Field label="姓名"><input type="text" value={newP.name} onChange={snf("name")} placeholder="病人姓名" style={inputStyle}/></Field>
        <Field label="病歷號"><input type="text" value={newP.mrn} onChange={snf("mrn")} placeholder="MRN" style={inputStyle}/></Field>
        <Field label="化療組合"><input type="text" value={newP.regimen} onChange={snf("regimen")} placeholder="FOLFOX、AC、R-CHOP..." style={inputStyle}/></Field>
        <Field label="總療程次數"><input type="number" min={1} max={99} value={newP.totalCycles} onChange={snf("totalCycles")} placeholder="例如：6" style={inputStyle}/></Field>
      </Modal>}
    </div>
  );
}

// ── Root ───────────────────────────────────────────────────────────
function App() {
  const [authed, setAuthed] = useState(false);
  const API_URL = ""; // 之後填入 Cloudflare Tunnel 網址
  if (!authed) return <LoginScreen onLogin={()=>setAuthed(true)} />;
  return <MainApp apiUrl={API_URL} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
